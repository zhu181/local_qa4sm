[project]
name = "local-qa4sm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dask[distributed]>=2026.1.2",
    "ismn>=1.5.2",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pygeobase>=0.6.3",
    "pygeogrids>=0.5.3",
    "pynetcf>=0.5.2",
    "pytesmo>=0.18.0",
    "pytz>=2026.1.post1",
    "qa4sm-preprocessing",
    "qa4sm-reader",
    "rioxarray>=0.22.0",
    "scipy>=1.17.1",
    "smap-io>=0.8",
    "xarray>=2026.2.0",
]

[tool.uv.sources]
qa4sm-preprocessing = { path = "qa4sm-preprocessing", editable = true }
qa4sm-reader = { path = "qa4sm-reader", editable = true }

[project.scripts]
qa4sm-validate = "validator.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p no:cacheprovider"

[tool.mypy]
python_version = "3.13"
strict = false
exclude = ["qa4sm-reader", "qa4sm-preprocessing"]
