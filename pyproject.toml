[project]
name = "local-qa4sm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "dask[distributed]>=2026.1.2",
  "ismn>=1.5.2",
  "numpy>=2.4.3",
  "pandas>=3.0.1",
  "pygeobase>=0.6.3",
  "pygeogrids>=0.5.3",
  "pynetcf>=0.5.2",
  "pytesmo[gpu]",
  "pytz>=2026.1.post1",
  "qa4sm-preprocessing",
  "qa4sm-reader",
  "rioxarray>=0.22.0",
  "scipy>=1.17.1",
  "setuptools>=83.0.0",
  "smap-io>=0.8",
  "xarray>=2026.2.0",
  "pyqt5-qt5==5.15.2",
]

[project.scripts]
qa4sm-validate = "validator.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-v --tb=short -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["pytesmo"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
validator = ["validation_run.template.json"]

[tool.uv.sources]
pytesmo={path = "./pytesmo",editable=true}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
